<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff0f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>PiPi 工作台</title>
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-startup-image" href="./startup-iphone-13.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="./startup-iphone-14-pro.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <style>html,body{background:#fff0f7}#launch-splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(145deg,#fff0f7,#f2e9ff);opacity:1;transition:opacity .18s ease}#launch-splash.is-hidden{opacity:0;pointer-events:none}#launch-splash img{width:116px;height:116px;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(113,75,117,.18))}</style>
  </head>
  <body>
    <div id="launch-splash" aria-hidden="true"><img src="./kuromi-avatar-mobile.png" width="256" height="256" alt="" /></div>
    <main class="app-shell showing-today">
      <section id="today" class="view active">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="today-date">10 月 16 日 · 星期五</p>
            <h1>嗨，皮皮 <span>✦</span></h1>
          </div>
          <button class="avatar" aria-label="我的头像"><img src="./kuromi-avatar-mobile.png" width="256" height="256" decoding="async" alt="库洛米头像" /></button>
        </header>

        <div class="section-heading">
          <div><h2>我的日程</h2><p id="schedule-count">把今天安排得刚刚好</p></div>
          <button class="round-add" data-action="new-task" aria-label="添加今日工作">＋</button>
        </div>
        <div id="task-list" class="task-list"></div>
      </section>

      <section id="weather-card" class="weather-card" aria-live="polite" aria-label="今日天气">
        <span id="weather-icon" class="weather-icon" aria-hidden="true">🌤️</span>
        <div class="weather-copy">
          <span class="weather-label">实时天气 · <b id="weather-city">成都·武侯</b></span>
          <strong id="weather-status">正在获取天气</strong>
        </div>
        <b id="weather-temperature" class="weather-temperature">--°</b>
      </section>

      <section class="progress-card" aria-label="今日进度">
        <div class="progress-heading">
          <div><span class="pill">今日进度</span><p id="progress-copy">慢慢来，也很厉害</p></div>
          <strong id="progress-number">0%</strong>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress-fill"></i></div>
      </section>

      <section id="calendar" class="view">
        <header class="topbar compact">
          <div><p class="eyebrow">工作日历</p><h1 id="calendar-title">看看这一周</h1></div>
          <button class="avatar" aria-label="我的头像"><img src="./kuromi-avatar-mobile.png" width="256" height="256" decoding="async" alt="库洛米头像" /></button>
        </header>
        <div class="switcher calendar-switch" role="tablist" aria-label="日历视图">
          <button class="calendar-switch-button active" data-calendar-period="week">本周</button>
          <button class="calendar-switch-button" data-calendar-period="month">本月</button>
        </div>
        <div class="calendar-controls" aria-label="选择查看周">
          <button id="previous-period" aria-label="上一周期">‹</button>
          <button id="current-period" class="current-week">本周</button>
          <button id="next-period" aria-label="下一周期">›</button>
        </div>
        <section id="calendar-summary" class="calendar-summary"></section>
        <div id="calendar-content"></div>
      </section>

      <section id="report" class="view">
        <header class="topbar compact">
          <div><p class="eyebrow">小小复盘室</p><h1>工作报告</h1></div>
          <img class="report-icon" src="./kuromi-report-icon-mobile.png" width="256" height="256" loading="lazy" decoding="async" alt="库洛米" />
        </header>
        <div class="switcher" role="tablist">
          <button class="report-switch active" data-report-period="week">本周</button>
          <button class="report-switch" data-report-period="month">本月</button>
        </div>
        <section id="report-content"></section>
      </section>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item active" data-view="today"><span>⌂</span><b>今日</b></button>
        <button class="nav-item" data-view="calendar"><span>▦</span><b>日历</b></button>
        <button class="nav-item" data-view="report"><span>◔</span><b>报告</b></button>
      </nav>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <button id="close-modal" class="close" aria-label="关闭">×</button>
        <p id="modal-kicker" class="eyebrow"></p>
        <h2 id="modal-title"></h2>
        <form id="modal-form"></form>
      </div>
    </div>
    <div id="confirmation" class="modal confirmation hidden" role="dialog" aria-modal="true" aria-label="删除确认">
      <div class="confirm-card">
        <div class="confirm-illustration"><img src="./kuromi-avatar-mobile.png" width="256" height="256" decoding="async" alt="库洛米" /></div>
        <p class="eyebrow">请确认一下</p>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button id="cancel-confirmation" type="button">再想想</button>
          <button id="accept-confirmation" type="button">确定删除</button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
